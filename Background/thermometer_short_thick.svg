<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 320 640" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Outer body gradient -->
    <linearGradient id="outerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#e9f1ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfd9ea" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Inner glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#dfe8f7" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Soft shadow (very subtle, still transparent background) -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b2a46" flood-opacity="0.18"/>
    </filter>

    <!-- Clip for the fill area (what you will animate/paint red) -->
    <clipPath id="thermoFillClip">
      <!-- Tube -->
      <rect x="134" y="96" width="52" height="368" rx="26" ry="26"/>
      <!-- Bulb -->
      <circle cx="160" cy="488" r="52"/>
    </clipPath>

    <!-- Highlight gradient -->
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- GROUP: Thermometer body -->
  <g filter="url(#softShadow)">
    <!-- Outer silhouette -->
    <path d="M160 40
             C205 40 238 74 238 118
             L238 424
             C238 448 226 470 208 484
             C235 501 252 532 252 568
             C252 617 212 640 160 640
             C108 640 68 617 68 568
             C68 532 85 501 112 484
             C94 470 82 448 82 424
             L82 118
             C82 74 115 40 160 40 Z"
          fill="url(#outerGrad)" stroke="#9fb3d8" stroke-width="4"/>

    <!-- Inner glass channel (tube + bulb rim) -->
    <path d="M160 70
             C190 70 212 92 212 122
             L212 428
             C212 446 203 462 190 472
             C210 486 224 510 224 538
             C224 577 194 596 160 596
             C126 596 96 577 96 538
             C96 510 110 486 130 472
             C117 462 108 446 108 428
             L108 122
             C108 92 130 70 160 70 Z"
          fill="url(#glassGrad)" stroke="#b7c7e6" stroke-width="3"/>

    <!-- Cutout area (transparent) - this is where your red fill can show through behind the SVG -->
    <g clip-path="url(#thermoFillClip)">
      <!-- Transparent window -->
      <rect x="98" y="70" width="124" height="540" fill="#000" fill-opacity="0"/>
    </g>

    <!-- Right-side tick track (no numbers) -->
    <g opacity="0.75">
      <rect x="220" y="130" width="10" height="300" rx="5" fill="#d1dbef"/>
      <!-- ticks -->
      <g stroke="#8ea2c8" stroke-width="3" stroke-linecap="round">
        <line x1="220" y1="150" x2="244" y2="150"/>
        <line x1="220" y1="180" x2="238" y2="180"/>
        <line x1="220" y1="210" x2="244" y2="210"/>
        <line x1="220" y1="240" x2="238" y2="240"/>
        <line x1="220" y1="270" x2="244" y2="270"/>
        <line x1="220" y1="300" x2="238" y2="300"/>
        <line x1="220" y1="330" x2="244" y2="330"/>
        <line x1="220" y1="360" x2="238" y2="360"/>
        <line x1="220" y1="390" x2="244" y2="390"/>
        <line x1="220" y1="420" x2="238" y2="420"/>
      </g>
    </g>

    <!-- Gloss highlight -->
    <path d="M126 90
             C112 110 112 140 112 160
             L112 422
             C112 444 118 458 132 468
             C118 482 108 506 108 536
             C108 560 120 578 140 586
             C112 570 98 548 98 522
             L98 160
             C98 124 108 100 126 90 Z"
          fill="url(#highlightGrad)"/>

    <!-- Base pedestal -->
    <path d="M98 600
             C98 590 106 582 116 582
             L204 582
             C214 582 222 590 222 600
             L222 616
             C222 626 214 634 204 634
             L116 634
             C106 634 98 626 98 616 Z"
          fill="url(#outerGrad)" stroke="#9fb3d8" stroke-width="3"/>
  </g>

  <!-- OPTIONAL: Placeholder group you can target in code.
       Anything you draw inside this group will be clipped to the tube+bulb. -->
  <g id="fill-area" clip-path="url(#thermoFillClip)"></g>
</svg>
