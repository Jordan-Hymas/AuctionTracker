version: '3.8'

services:
  # Backend API + WebSocket server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/auction.db
      - UPLOAD_DIR=/app/data/uploads
      - CORS_ORIGIN=*
    volumes:
      - auction-data:/app/data
    networks:
      - auction-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend React app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_WS_URL=/ws
    depends_on:
      - backend
    networks:
      - auction-network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - frontend
    networks:
      - auction-network
    restart: unless-stopped

networks:
  auction-network:
    driver: bridge

volumes:
  auction-data:
    driver: local
